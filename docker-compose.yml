services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FRONTEND_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      STAGE2_RERANKER: "off"
      USE_LTR_RERANK: "false"
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
